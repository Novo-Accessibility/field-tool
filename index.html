  --wh:#FFF; --red:#C0392B; --red2:#A93226; --redp:#FCEAE8;
  --bdr:#E5DFD6; --r:12px; --rl:20px; --rx:28px;
  --s1:#2D9D6A; --s2:#7CB342; --s3:#E8A838; --s4:#E07B39; --s5:#C0392B; --s0:#B5ADA2;
  --blue:#2D7D9A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.62;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--red);text-decoration:none}

/* ── header ─────────────────────────────── */
.app-header{background:var(--ink);color:var(--wh);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;gap:16px}
.hbrand{display:flex;align-items:center;gap:9px;font-family:'Instrument Serif',serif;font-size:1.1rem;color:#fff}
.hmark{width:26px;height:26px;border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hbrand em{font-style:normal;color:rgba(255,255,255,.5);font-size:.82rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;letter-spacing:.04em;margin-left:4px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.header-status{font-size:.78rem;color:rgba(255,255,255,.55);font-weight:600}
.clientpick{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:50px;padding:6px 14px;font-size:.8rem;font-weight:700;max-width:230px}
.clientpick option{color:#1A1A1A}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;font-size:.83rem;font-weight:700;border-radius:50px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--red);color:var(--wh)}
.btn-primary:hover{background:var(--red2)}
.btn-secondary{background:var(--bgw);color:var(--ink)}
.btn-secondary:hover{background:var(--bdr)}
.btn-ghost{background:transparent;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.28)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-danger{background:var(--redp);color:var(--red2)}
.btn-sm{padding:5px 12px;font-size:.76rem}

/* ── mode bar ───────────────────────────── */
.modebar{background:var(--bgw);border-bottom:1px solid var(--bdr);padding:8px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.82rem}
.modebar .lbl{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.68rem;color:var(--ink3)}
.seg{display:inline-flex;background:var(--wh);border:1px solid var(--bdr);border-radius:50px;overflow:hidden}
.seg button{padding:5px 14px;font-size:.78rem;font-weight:700;color:var(--ink3)}
.seg button.on{background:var(--red);color:#fff}
.modehint{color:var(--ink3);font-size:.78rem}

/* ── tabs ───────────────────────────────── */
.tab-bar{background:var(--bg);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;flex-wrap:wrap;position:sticky;top:46px;z-index:90}
.tab{padding:11px 14px;font-size:.82rem;font-weight:700;color:var(--ink3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transition:all .15s}
.tab:hover{color:var(--red)}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
.tab-badge{background:var(--bgw);color:var(--ink2);font-size:.66rem;padding:1px 7px;border-radius:10px;font-weight:800}
.tab-badge.done{background:var(--s1);color:#fff}
.tab-badge.warn{background:var(--s3);color:#fff}
.tab-badge.crit{background:var(--red);color:#fff}

main{max-width:1120px;margin:0 auto;padding:28px 22px 90px}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}

.panel-header{margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.panel-header h2{font-size:2rem;margin-bottom:4px}
.panel-header .subtitle{font-size:.94rem;color:var(--ink2)}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--red);margin-bottom:6px}

/* ── cards + forms ──────────────────────── */
.section-card{background:var(--wh);border:1px solid var(--bdr);border-radius:var(--rl);padding:22px 24px;margin-bottom:16px}
.section-card h3{font-size:1.25rem;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field-row{display:flex;flex-direction:column}
.field-row.full{grid-column:1/-1}
.field-row label{font-size:.7rem;font-weight:800;color:var(--ink2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em}
.field-row .req{color:var(--red)}
.field-row input,.field-row select,.field-row textarea{padding:10px 13px;border:2px solid var(--bdr);border-radius:10px;background:var(--bg);transition:border-color .15s;font-size:.92rem}
.field-row input:focus,.field-row select:focus,.field-row textarea:focus{outline:none;border-color:var(--red);background:var(--wh)}
.field-row textarea{min-height:74px;resize:vertical}
.field-row.checkbox{flex-direction:row;align-items:center;gap:10px}
.field-row.checkbox input{width:auto;flex-shrink:0}
.field-row.checkbox label{margin:0;text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:600;cursor:pointer}

/* ── category header ────────────────────── */
.category-header{background:var(--wh);border:1px solid var(--bdr);border-left:4px solid var(--red);border-radius:var(--rl);padding:18px 22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.category-header h2{font-size:1.55rem;display:flex;align-items:center;gap:10px}
.category-header .icon{font-size:1.35rem}
.category-header p{font-size:.85rem;color:var(--ink3);margin-top:2px}
.category-progress{text-align:right;flex-shrink:0}
.category-progress strong{font-family:'Instrument Serif',serif;color:var(--ink);font-size:1.7rem;display:block;line-height:1}
.category-progress span{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}

.instance-switcher{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.instance-pill{display:flex;align-items:stretch;border:1px solid var(--bdr);border-radius:50px;overflow:hidden;background:var(--wh)}
.instance-pill.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.instance-select{border:none;background:transparent;padding:7px 12px;font-size:.8rem;font-weight:700;cursor:pointer}
.instance-pill.active .instance-select{color:var(--red)}
.instance-rename,.instance-remove{border:none;border-left:1px solid var(--bdr);background:var(--bg);padding:7px 11px;cursor:pointer;font-size:.72rem;color:var(--ink3)}
.instance-remove{color:var(--red)}
.instance-add{border:1px dashed var(--red);background:transparent;color:var(--red);border-radius:50px;padding:7px 15px;font-size:.8rem;font-weight:700;cursor:pointer}

/* ── feature cards ──────────────────────── */
.feature-list{display:flex;flex-direction:column;gap:10px}
.feature-card{background:var(--wh);border:1px solid var(--bdr);border-left:4px solid var(--bdr);border-radius:var(--r);padding:15px 18px;transition:border-color .2s}
.feature-card.s1{border-left-color:var(--s1)}
.feature-card.s2{border-left-color:var(--s2)}
.feature-card.s3{border-left-color:var(--s3)}
.feature-card.s4{border-left-color:var(--s4)}
.feature-card.s5{border-left-color:var(--s5)}
.feature-card.core{background:#FFFDFB}
.feature-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:8px}
.feature-id{font-size:.68rem;color:var(--ink3);font-weight:800;letter-spacing:.06em}
.feature-title{font-family:'Instrument Serif',serif;font-size:1.16rem;color:var(--ink);margin:1px 0 6px;line-height:1.2}
.feature-meta{display:flex;flex-wrap:wrap;gap:7px;font-size:.7rem;align-items:center}
.pill{padding:2px 9px;border-radius:50px;font-size:.66rem;font-weight:800;letter-spacing:.03em}
.pill.clause{background:#E8F1F4;color:#175A70;font-family:ui-monospace,Menlo,monospace}
.pill.bp{background:var(--bgw);color:var(--ink3);font-style:italic}
.pill.weight{background:var(--ink);color:var(--bgw)}
.pill.cost{background:var(--bgw);color:var(--ink2)}
.pill.aadl{background:#E7F3EC;color:#1F6B45}
.pill.corepill{background:var(--redp);color:var(--red2)}
.pill.rc{background:var(--wh);border:1px solid var(--bdr);color:var(--ink3)}
.feature-required{font-size:.85rem;color:var(--ink2);margin-bottom:8px;background:var(--bg);padding:8px 12px;border-radius:10px;border-left:2px solid var(--red)}
.feature-required strong{color:var(--ink)}
.feature-guidance{font-size:.8rem;color:var(--ink3);font-style:italic;margin-bottom:10px}
.feature-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)}
.severity-buttons{display:flex;flex-wrap:wrap;gap:4px}
.severity-btn{padding:6px 11px;font-size:.74rem;font-weight:700;border:1px solid var(--bdr);background:var(--wh);color:var(--ink3);border-radius:50px;transition:all .15s}
.severity-btn:hover{border-color:var(--ink3)}
.severity-btn.active{color:#fff;border-color:transparent}
.severity-btn.active.s0{background:var(--s0)}
.severity-btn.active.s1{background:var(--s1)}
.severity-btn.active.s2{background:var(--s2)}
.severity-btn.active.s3{background:var(--s3)}
.severity-btn.active.s4{background:var(--s4)}
.severity-btn.active.s5{background:var(--s5)}
.measure-input{border:2px solid var(--bdr);border-radius:10px;padding:7px 12px;font-size:.85rem;background:var(--bg);width:210px}
.measure-input:focus{outline:none;border-color:var(--red);background:var(--wh)}
.feature-notes{margin-top:9px;width:100%}
.feature-notes textarea{width:100%;padding:9px 12px;border:2px solid var(--bdr);border-radius:10px;background:var(--bg);font-size:.85rem;min-height:48px;resize:vertical}
.feature-notes textarea:focus{outline:none;border-color:var(--red);background:var(--wh)}
.photo-controls{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.photo-btn{padding:6px 14px;font-size:.76rem;background:var(--bgw);color:var(--ink);border-radius:50px;font-weight:700}
.photo-btn:hover{background:var(--bdr)}
.photo-count{font-size:.74rem;color:var(--ink3);font-weight:700}
.photo-count.short{color:var(--red)}
.photo-thumbnails{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photo-thumb{position:relative;width:66px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--bdr)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb .remove-photo{position:absolute;top:3px;right:3px;background:var(--red);color:#fff;width:18px;height:18px;border-radius:50%;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:800}

/* ── dashboard ──────────────────────────── */
.score-hero{background:linear-gradient(150deg,#141414,#2A1D1B);color:#fff;padding:28px 32px;border-radius:var(--rx);margin-bottom:20px;display:grid;grid-template-columns:150px 1fr;gap:30px;align-items:center}
.score-circle{width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;border:3px solid rgba(255,255,255,.16)}
.score-num{font-family:'Instrument Serif',serif;font-size:3.1rem;color:#fff;line-height:1}
.score-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.13em;color:#E08C82;margin-top:4px;font-weight:800}
.score-hero h2{color:#fff;font-size:1.7rem;margin-bottom:6px}
.score-hero p{color:rgba(255,255,255,.7);font-size:.9rem}
.score-hero .internal{margin-top:12px;font-size:.76rem;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.14);padding-top:10px}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.dash-card{background:var(--wh);border:1px solid var(--bdr);border-top:3px solid var(--red);border-radius:var(--rl);padding:18px 20px}
.dash-card.s5{border-top-color:var(--s5)}.dash-card.s4{border-top-color:var(--s4)}.dash-card.s3{border-top-color:var(--s3)}.dash-card.s1{border-top-color:var(--s1)}
.dash-card .label{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:800;margin-bottom:6px}
.dash-card .value{font-family:'Instrument Serif',serif;font-size:2.1rem;color:var(--ink);line-height:1}
.dash-card .sub{font-size:.74rem;color:var(--ink3);margin-top:4px}
.findings-table{width:100%;background:var(--wh);border:1px solid var(--bdr);border-radius:var(--rl);border-collapse:separate;border-spacing:0;overflow:hidden;margin-bottom:20px}
.findings-table th{background:var(--ink);color:#fff;padding:10px 12px;text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.findings-table td{padding:9px 12px;font-size:.85rem;border-bottom:1px solid var(--bdr);color:var(--ink2)}
.findings-table tr:last-child td{border-bottom:none}
.findings-table .sev-cell{width:6px;padding:0!important}
.findings-table .sev-cell.s1{background:var(--s1)}.findings-table .sev-cell.s2{background:var(--s2)}.findings-table .sev-cell.s3{background:var(--s3)}.findings-table .sev-cell.s4{background:var(--s4)}.findings-table .sev-cell.s5{background:var(--s5)}

/* ── report ─────────────────────────────── */
.report-controls{background:var(--wh);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px 20px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.report-options{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.report-output{background:var(--wh);border:1px solid var(--bdr);border-radius:var(--rl);padding:52px 56px;margin-bottom:20px;color:var(--ink);line-height:1.62}
.report-output h1{font-size:2.2rem;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px}
.report-output h2{font-size:1.55rem;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bdr)}
.report-output h3{font-size:1.2rem;color:var(--ink);margin:18px 0 8px}
.report-output p{margin-bottom:10px;font-size:.92rem}
.report-output table{width:100%;border-collapse:collapse;margin:14px 0}
.report-output th,.report-output td{padding:8px 10px;text-align:left;border:1px solid var(--bdr);font-size:.84rem}
.report-output th{background:var(--ink);color:#fff;font-weight:700}
.report-output .meta-block{background:var(--bgw);padding:14px 18px;border-left:3px solid var(--red);border-radius:0 12px 12px 0;margin:14px 0}
.report-output .disclaimer{margin-top:30px;padding:16px 20px;background:var(--bgw);border-radius:12px;font-size:.8rem;color:var(--ink2);line-height:1.55}
.report-output .rank-row{display:grid;grid-template-columns:30px 1fr 110px 110px;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr);align-items:center;font-size:.86rem}
.report-output .rank-row .rk{width:26px;height:26px;background:var(--red);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem}
.report-output .photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.report-output .photo-cell img{width:100%;border-radius:10px;border:1px solid var(--bdr)}
.report-output .cap{font-size:.78rem;color:var(--ink3);margin-top:4px}

/* ── misc ───────────────────────────────── */
.empty-state{text-align:center;padding:52px 24px;color:var(--ink3);background:var(--wh);border:1px dashed var(--bdr);border-radius:var(--rx)}
.empty-state h3{font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.callout{background:var(--bgw);border-left:3px solid var(--ink);border-radius:0 12px 12px 0;padding:14px 18px;margin:14px 0;font-size:.88rem;color:var(--ink2)}
.callout strong{color:var(--ink)}
.callout.warn{background:var(--redp);border-left-color:var(--red);color:#7A2019}
.storage-bar{height:8px;background:var(--bdr);border-radius:50px;overflow:hidden;margin:8px 0}
.storage-bar div{height:100%;background:var(--s1)}
.storage-bar.warn div{background:var(--s3)}
.storage-bar.crit div{background:var(--red)}
.clientrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--bdr);border-radius:var(--r);background:var(--wh);margin-bottom:8px}
.clientrow.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.clientrow .cn{font-weight:700}
.clientrow .cm{font-size:.76rem;color:var(--ink3)}
.clientrow .ca{display:flex;gap:6px}
.purged{font-size:.7rem;font-weight:800;color:var(--s1);text-transform:uppercase;letter-spacing:.06em}

@media print{
  .app-header,.tab-bar,.modebar,.report-controls{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:100%}
  .report-output{border:none;padding:0}
}
@media (max-width:820px){
  .field-grid{grid-template-columns:1fr}
  .feature-header{flex-direction:column;gap:6px}
  .severity-buttons{width:100%}
  .severity-btn{flex:1;min-width:0}
  .score-hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .dashboard-grid{grid-template-columns:repeat(2,1fr)}
  .report-output{padding:22px}
  main{padding:16px 14px 80px}
  .tab-bar{padding:0 6px;overflow-x:auto;flex-wrap:nowrap}
  .tab{padding:10px 11px;font-size:.76rem;white-space:nowrap}
  .app-header{padding:8px 14px}
  .clientpick{max-width:140px}
}
</style>
</head>

<header class="app-header">

<script>
/* Senior Home Safety — Assessment Tool v3
   Changes from v2: multi-client files, photographs in IndexedDB (not localStorage),
   field mode (core set + intake-triggered modules), report categories unified with
   novoseniorsafety.com, funding matched rather than dumped, retention purge with a
   stamped deletion date, and the safety score kept internal by default. */

// ══════════════════════════════════════════════ IndexedDB (photos)
const IDB_NAME = 'shs_photos_v3', IDB_STORE = 'photos';
let _db = null;
function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore(IDB_STORE, { keyPath: 'key' });
      s.createIndex('client', 'clientId', { unique: false });
      s.createIndex('feature', 'featureKey', { unique: false });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function idbPut(rec) { return idb().then(db => new Promise((res, rej) => {
  const t = db.transaction(IDB_STORE, 'readwrite'); t.objectStore(IDB_STORE).put(rec);
  t.oncomplete = res; t.onerror = () => rej(t.error);
})); }
function idbDel(key) { return idb().then(db => new Promise((res, rej) => {
  const t = db.transaction(IDB_STORE, 'readwrite'); t.objectStore(IDB_STORE).delete(key);
  t.oncomplete = res; t.onerror = () => rej(t.error);
})); }
function idbByIndex(index, value) { return idb().then(db => new Promise((res, rej) => {
  const out = [], t = db.transaction(IDB_STORE, 'readonly');
  const req = t.objectStore(IDB_STORE).index(index).openCursor(IDBKeyRange.only(value));
  req.onsuccess = () => { const c = req.result; if (c) { out.push(c.value); c.continue(); } else res(out); };
  req.onerror = () => rej(req.error);
})); }
async function idbDeleteClient(clientId) {
  const recs = await idbByIndex('client', clientId);
  for (const r of recs) await idbDel(r.key);
  return recs.length;
}

// ══════════════════════════════════════════════ client registry
const IDX_KEY = 'shs_v3_index';
const CK = id => 'shs_v3_client_' + id;
let clients = [], state = null, currentId = null, objectUrls = [];

function loadIndex() {
  try { clients = JSON.parse(localStorage.getItem(IDX_KEY)) || []; } catch (e) { clients = []; }
}
function saveIndex() { try { localStorage.setItem(IDX_KEY, JSON.stringify(clients)); } catch (e) {} }

function blankState(id, name) {
  return {
    id, name: name || 'Untitled assessment', created: Date.now(),
    intake: { assessor_name: DATA.assessorDefaults.name, assessor_credentials: DATA.assessorDefaults.credentials },
    findings: {},          // featureKey -> {severity, measurement, notes, photos:[keys]}
    roomInstances: {}, floorPlan: null, floorPlanCaption: '',
    mode: 'field', purgedAt: null, deleteAfter: null
  };
}
function loadClient(id) {
  try {
    const raw = localStorage.getItem(CK(id));
    state = raw ? Object.assign(blankState(id), JSON.parse(raw)) : blankState(id);
  } catch (e) { state = blankState(id); }
  currentId = id;
  try { localStorage.setItem('shs_v3_last', id); } catch (e) {}
}
function saveState() {
  if (!state) return;
  try {
    localStorage.setItem(CK(state.id), JSON.stringify(state));
    const row = clients.find(c => c.id === state.id);
    if (row) { row.name = state.name; row.updated = Date.now(); saveIndex(); }
    flash('Saved ' + new Date().toLocaleTimeString());
  } catch (e) {
    flash('Save failed', true);
    alert('Could not save this assessment. Export the file now to be safe, then close another assessment to free space.');
  }
}
let saveTimer;
function debouncedSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 350); }
function flash(msg, bad) {
  const el = document.getElementById('saveStatus'); if (!el) return;
  el.textContent = msg; el.style.color = bad ? '#E0685A' : 'rgba(255,255,255,.55)';
}
function newClient(name) {
  const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  clients.unshift({ id, name: name || 'Untitled assessment', created: Date.now(), updated: Date.now() });
  saveIndex(); loadClient(id); state.name = name || 'Untitled assessment'; saveState();
  return id;
}

// ══════════════════════════════════════════════ scope: core + triggered modules
function cognitiveActive() {
  const s = state.intake.cognitive_status;
  return !!s && s !== 'No known concerns' && s !== 'Mild forgetfulness (age-typical)';
}
function usesMobilityAid() {
  const a = state.intake.mobility_aid;
  return !!a && a !== 'None';
}
function hasStairs() {
  const s = state.intake.stair_use;
  return !s || s !== 'No stairs in home';
}
function catActive(cat) {
  if (cat.gated && !cognitiveActive()) return false;
  if (cat.id === 'stairs' && !hasStairs()) return false;
  return true;
}
// A feature is in scope for FIELD mode when it is core, or belongs to a triggered module.
function inFieldScope(cat, f) {
  if (f.core) return true;
  if (cat.gated && cognitiveActive()) return f.weight >= 4;     // dementia module, high-weight items
  if (f.clearance && usesMobilityAid()) return true;            // clearance module
  return false;
}
function visibleFeatures(cat) {
  if (!catActive(cat)) return [];
  if (state.mode === 'all') return cat.features;
  return cat.features.filter(f => inFieldScope(cat, f));
}

// ══════════════════════════════════════════════ instances
function getInstances(catId) {
  const v = state.roomInstances[catId];
  return (v && v.length) ? v : ['1'];
}
function instanceLabel(cat, key) {
  const n = state.roomInstances[cat.id + '_labels'] || {};
  return n[key] || (cat.name + ' ' + key);
}
function activeInstance(catId) {
  return state.roomInstances['_active_' + catId] || getInstances(catId)[0];
}
function setActiveInstance(catId, key) { state.roomInstances['_active_' + catId] = key; }
function qkey(fid, inst) { return inst === '1' ? fid : fid + '#' + inst; }
function baseId(k) { return String(k).split('#')[0]; }

function addInstance(cat) {
  const list = getInstances(cat.id).slice();
  const next = String(Math.max(...list.map(Number)) + 1);
  list.push(next); state.roomInstances[cat.id] = list;
  const name = prompt('Name this ' + cat.name.toLowerCase(), cat.name + ' ' + next);
  if (name) { const n = state.roomInstances[cat.id + '_labels'] || {}; n[next] = name; state.roomInstances[cat.id + '_labels'] = n; }
  setActiveInstance(cat.id, next); saveState(); buildCategoryTab(cat); renderTabBar();
}
function removeInstance(cat, key) {
  const list = getInstances(cat.id).filter(k => k !== key);
  if (!list.length) return;
  state.roomInstances[cat.id] = list;
  for (const f of cat.features) delete state.findings[qkey(f.id, key)];
  setActiveInstance(cat.id, list[0]); saveState(); buildCategoryTab(cat); renderTabBar();
}

// ══════════════════════════════════════════════ features + scoring
function allFeatures() {
  const out = [];
  for (const cat of DATA.categories) {
    if (!catActive(cat)) continue;
    const feats = visibleFeatures(cat);
    if (cat.multiInstance) {
      for (const inst of getInstances(cat.id)) {
        const many = getInstances(cat.id).length > 1;
        for (const f of feats) out.push(Object.assign({}, f, {
          key: qkey(f.id, inst), baseId: f.id, cat,
          instanceLabel: many ? instanceLabel(cat, inst) : null
        }));
      }
    } else {
      for (const f of feats) out.push(Object.assign({}, f, { key: f.id, baseId: f.id, cat, instanceLabel: null }));
    }
  }
  return out;
}
function scoredFindings() {
  return allFeatures().map(f => ({ f, r: state.findings[f.key] }))
    .filter(x => x.r && x.r.severity);
}
function computeScore() {
  let num = 0, den = 0;
  for (const { f, r } of scoredFindings()) {
    const sev = DATA.severityOptions.find(s => s.id === r.severity);
    if (!sev || sev.score === null) continue;
    num += sev.score * f.weight; den += 100 * f.weight;
  }
  return den ? Math.round(num / den * 100) : null;
}
function completeness() {
  const total = allFeatures().length;
  const done = scoredFindings().length;
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}
function costMid(band) { return DATA.costBands[band].midpoint; }
function nextDollar() {
  const list = scoredFindings().filter(x => x.r.severity >= 2);
  for (const x of list) x.score = (x.f.weight * x.r.severity) / Math.sqrt(costMid(x.f.cost));
  list.sort((a, b) => b.score - a.score);
  return list;
}
function phaseOf(x) {
  const band = x.f.cost, sev = x.r.severity;
  if (band === 'L' && sev >= 3) return 1;
  if (sev >= 4) return 2;
  if (band === 'C') return 3;
  return sev >= 3 ? 2 : 3;
}

// ══════════════════════════════════════════════ funding matching
function matchedFunding() {
  const items = scoredFindings().filter(x => x.r.severity >= 2);
  const out = [];
  const add = (ac, why) => { if (!out.find(o => o.p.acronym === ac)) {
    const p = DATA.fundingPrograms.find(p => p.acronym === ac); if (p) out.push({ p, why }); } };
  if (items.some(x => x.f.aadl)) add('AADL', 'Equipment identified in this assessment may be AADL-eligible. Authorization requires an AADL-authorized assessor, normally an occupational therapist.');
  if (items.some(x => x.f.cost === 'H' || x.f.cost === 'C')) add('SHARP', 'This assessment identifies structural or higher-cost modifications of the kind SHARP funds.');
  if (items.some(x => x.f.cost === 'M' || x.f.cost === 'H' || x.f.cost === 'C')) add('HATC', 'Several recommended modifications are likely to qualify as eligible accessibility expenses.');
  if (usesMobilityAid() && items.some(x => x.f.clearance || x.f.cost === 'H' || x.f.cost === 'C'))
    add('RAMP', 'The occupant uses a mobility aid and access-related modifications are recommended.');
  return out;
}

// ══════════════════════════════════════════════ rendering helpers
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function switchTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const p = document.getElementById('panel-' + id), t = document.getElementById('tab-' + id);
  if (p) p.classList.add('active');
  if (t) t.classList.add('active');
  if (id === 'dashboard') renderDashboard();
  if (id === 'report') renderReportTab();
  if (id === 'clients') renderClientsTab();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ── intake ────────────────────────────────────
function renderField(f) {
  const v = state.intake[f.id] != null ? state.intake[f.id] : (f.default != null ? f.default : '');
  const req = f.required ? ' <span class="req">*</span>' : '';
  if (f.type === 'checkbox')
    return `<div class="field-row checkbox full"><input type="checkbox" id="in_${f.id}" data-field="${f.id}" ${v ? 'checked' : ''}><label for="in_${f.id}">${esc(f.label)}${req}</label></div>`;
  const full = (f.type === 'textarea') ? ' full' : '';
  let input;
  if (f.type === 'select')
    input = `<select id="in_${f.id}" data-field="${f.id}"><option value="">— select —</option>` +
      f.options.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('') + '</select>';
  else if (f.type === 'textarea')
    input = `<textarea id="in_${f.id}" data-field="${f.id}">${esc(v)}</textarea>`;
  else
    input = `<input type="${f.type}" id="in_${f.id}" data-field="${f.id}" value="${esc(v)}">`;
  return `<div class="field-row${full}"><label for="in_${f.id}">${esc(f.label)}${req}</label>${input}</div>`;
}
function buildIntakeTab() {
  const c = document.getElementById('intake-form');
  c.innerHTML = DATA.intakeSections.map(s =>
    `<div class="section-card"><h3>${esc(s.title)}</h3><div class="field-grid">${s.fields.map(renderField).join('')}</div></div>`
  ).join('') + `<div class="callout"><strong>Scope triggers.</strong> Three intake answers change what the tool asks you to score on site: cognitive status opens the Alzheimer's and dementia module, mobility aid opens the clearance measurements, and stair use decides whether the stairs module applies. Fill those three before the visit.</div>`;
  c.querySelectorAll('[data-field]').forEach(el => {
    const ev = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
    el.addEventListener(ev, () => {
      state.intake[el.dataset.field] = el.type === 'checkbox' ? el.checked : el.value;
      if (['cognitive_status', 'mobility_aid', 'stair_use'].includes(el.dataset.field)) { renderModeBar(); renderTabBar(); rebuildCategoryTabs(); }
      if (el.dataset.field === 'client_name' && el.value) { state.name = el.value; renderClientPicker(); }
      debouncedSave();
    });
  });
}

// ── category panels ───────────────────────────

  const sev = r.severity || 0;
  const clause = f.sourceType === 'best_practice'
    ? `<span class="pill bp">Best practice</span>`
    : `<span class="pill clause">${esc(f.clause)}</span>`;
  const photos = (r.photos || []).length;
  const shortPhotos = sev >= 3 && photos < 2;
  return `<div class="feature-card ${sev ? 's' + sev : ''}${f.core ? ' core' : ''}" data-feature="${key}">
    <div class="feature-header"><div>
      <div class="feature-id">${esc(showId)}</div>
      <div class="feature-title">${esc(f.title)}</div>
      <div class="feature-meta">${clause}<span class="pill rc">${esc(f.rc)}</span>
        <span class="pill weight">Weight ${f.weight}</span>
        <span class="pill cost">${esc(DATA.costBands[f.cost].label)}</span>
        ${f.aadl ? '<span class="pill aadl">AADL possible</span>' : ''}
        ${f.core ? '<span class="pill corepill">Core</span>' : ''}</div>
    </div></div>
    <div class="feature-required"><strong>Required:</strong> ${esc(f.required)}</div>
    <div class="feature-guidance">${esc(f.guidance)}</div>
    <div class="feature-actions">
      <div class="severity-buttons">
        ${DATA.severityOptions.map(o => `<button class="severity-btn${sev === o.id ? ' active s' + o.id : ''}" data-sev="${o.id}" title="${esc(o.label)}">${o.id === 0 ? 'N/A' : o.id}</button>`).join('')}
      </div>
      <input class="measure-input" data-measure placeholder="Measured value" value="${esc(r.measurement || '')}">
      <button class="photo-btn" data-photo>Add photo</button>
      <span class="photo-count${shortPhotos ? ' short' : ''}" data-pcount>${photos ? photos + ' photo' + (photos > 1 ? 's' : '') : ''}${shortPhotos ? ' · 2 needed' : ''}</span>
    </div>
    <div class="photo-thumbnails" data-thumbs></div>
    <div class="feature-notes"><textarea data-notes placeholder="Notes — what you saw, what you told the client">${esc(r.notes || '')}</textarea></div>

}

function buildCategoryTab(cat) {
  const panel = document.getElementById('panel-' + cat.id);
  if (!panel) return;
  if (!catActive(cat)) {
    panel.innerHTML = `<div class="empty-state"><h3>Not applicable</h3><p>This module is switched off by the intake answers. Change them on the Intake tab to bring it back.</p></div>`;
    return;
  }
  const inst = cat.multiInstance ? activeInstance(cat.id) : '1';
  const feats = visibleFeatures(cat);
  const hidden = cat.features.length - feats.length;
  let switcher = '';
  if (cat.multiInstance) {
    switcher = '<div class="instance-switcher">' + getInstances(cat.id).map(k =>
      `<div class="instance-pill${k === inst ? ' active' : ''}"><button class="instance-select" data-inst="${k}">${esc(instanceLabel(cat, k))}</button>` +
      (getInstances(cat.id).length > 1 ? `<button class="instance-remove" data-rm="${k}">✕</button>` : '') + '</div>').join('') +
      `<button class="instance-add" data-add>+ Add ${esc(cat.name.toLowerCase())}</button></div>`;
  }
  const prog = feats.filter(f => (state.findings[qkey(f.id, inst)] || {}).severity).length;
  panel.innerHTML = `
    <div class="category-header">
      <div><h2><span class="icon">${cat.icon}</span>${esc(cat.name)}</h2><p>${esc(cat.description)}</p></div>
      <div class="category-progress"><strong>${prog}/${feats.length}</strong><span>Scored</span></div>
    </div>
    ${switcher}
    ${hidden > 0 ? `<div class="callout"><strong>${hidden} checkpoint${hidden > 1 ? 's' : ''} hidden in field mode.</strong> These are the observation-sweep items — photograph them on site and score them at the desk. Switch to Full scope in the bar above to see them now.</div>` : ''}
    <div class="feature-list">${feats.map(f => featureCard(f, qkey(f.id, inst), f.id + (inst !== '1' ? ' · ' + instanceLabel(cat, inst) : ''))).join('')}</div>`;
  wireCategory(cat, inst);
  feats.forEach(f => renderThumbs(qkey(f.id, inst)));
}

function wireCategory(cat, inst) {
  const panel = document.getElementById('panel-' + cat.id);
  panel.querySelectorAll('.instance-select').forEach(b => b.addEventListener('click', () => {
    setActiveInstance(cat.id, b.dataset.inst); saveState(); buildCategoryTab(cat);
  }));
  const add = panel.querySelector('[data-add]');
  if (add) add.addEventListener('click', () => addInstance(cat));
  panel.querySelectorAll('.instance-remove').forEach(b => b.addEventListener('click', () => {
    if (confirm('Remove this room and everything scored in it?')) removeInstance(cat, b.dataset.rm);
  }));
  panel.querySelectorAll('.feature-card').forEach(card => {
    const key = card.dataset.feature;
    const rec = () => (state.findings[key] = state.findings[key] || { severity: null, measurement: '', notes: '', photos: [] });
    card.querySelectorAll('.severity-btn').forEach(b => b.addEventListener('click', () => {
      const r = rec(); const v = parseInt(b.dataset.sev);
      r.severity = (r.severity === v) ? null : v;
      refreshCard(key); updateProgress(cat, inst); renderTabBar(); debouncedSave();
    }));
    card.querySelector('[data-measure]').addEventListener('input', e => { rec().measurement = e.target.value; debouncedSave(); });
    card.querySelector('[data-notes]').addEventListener('input', e => { rec().notes = e.target.value; debouncedSave(); });
    card.querySelector('[data-photo]').addEventListener('click', () => pickPhoto(key));
  });
}
function rebuildCategoryTabs() { DATA.categories.forEach(buildCategoryTab); }
function refreshCard(key) {
  const card = document.querySelector(`.feature-card[data-feature="${CSS.escape(key)}"]`);
  if (!card) return;
  const r = state.findings[key] || {};
  card.classList.remove('s1', 's2', 's3', 's4', 's5');
  if (r.severity) card.classList.add('s' + r.severity);
  card.querySelectorAll('.severity-btn').forEach(b => {
    const v = parseInt(b.dataset.sev);
    b.className = 'severity-btn' + (r.severity === v ? ' active s' + v : '');
  });
  const n = (r.photos || []).length, short = (r.severity >= 3) && n < 2;
  const pc = card.querySelector('[data-pcount]');
  pc.textContent = (n ? n + ' photo' + (n > 1 ? 's' : '') : '') + (short ? ' · 2 needed' : '');
  pc.className = 'photo-count' + (short ? ' short' : '');
}
function updateProgress(cat, inst) {
  const el = document.querySelector('#panel-' + cat.id + ' .category-progress strong');
  if (!el) return;
  const feats = visibleFeatures(cat);
  el.textContent = feats.filter(f => (state.findings[qkey(f.id, inst)] || {}).severity).length + '/' + feats.length;
}

// ── photos ────────────────────────────────────
function pickPhoto(key) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.capture = 'environment';
  inp.onchange = () => { handlePhotos(key, inp.files); };
  inp.click();
}
async function handlePhotos(key, files) {
  const r = state.findings[key] = state.findings[key] || { severity: null, measurement: '', notes: '', photos: [] };
  for (const file of files) {
    try {
      const blob = await downscale(file, 1600, 0.72);
      const pk = state.id + '|' + key + '|' + Date.now() + Math.random().toString(36).slice(2, 6);
      await idbPut({ key: pk, clientId: state.id, featureKey: key, blob, ts: Date.now() });
      r.photos = r.photos || []; r.photos.push(pk);
    } catch (e) { alert('That photo could not be saved: ' + e.message); }
  }
  saveState(); renderThumbs(key); refreshCard(key); updateStorage();
}
function downscale(file, maxDim, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) { if (w > h) { h = h * maxDim / w; w = maxDim; } else { w = w * maxDim / h; h = maxDim; } }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cv.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', q);
      };
      img.onerror = () => rej(new Error('not a readable image'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('could not read the file'));
    fr.readAsDataURL(file);
  });
}
async function renderThumbs(key) {
  const card = document.querySelector(`.feature-card[data-feature="${CSS.escape(key)}"]`);
  if (!card) return;
  const wrap = card.querySelector('[data-thumbs]');
  const r = state.findings[key] || {}; const keys = r.photos || [];
  wrap.innerHTML = '';
  if (!keys.length) return;
  const recs = await idbByIndex('feature', key);
  for (const pk of keys) {
    const rec = recs.find(x => x.key === pk); if (!rec) continue;
    const url = URL.createObjectURL(rec.blob); objectUrls.push(url);
    const d = document.createElement('div'); d.className = 'photo-thumb';
    d.innerHTML = `<img src="${url}" alt=""><button class="remove-photo">×</button>`;
    d.querySelector('button').addEventListener('click', async () => {
      await idbDel(pk);
      r.photos = r.photos.filter(x => x !== pk);
      saveState(); renderThumbs(key); refreshCard(key); updateStorage();
    });
    wrap.appendChild(d);
  }
}

// ── tab bar ───────────────────────────────────
function renderTabBar() {
  const bar = document.getElementById('tab-bar');
  const tabs = [['clients', 'Assessments', ''], ['intake', 'Intake', '']];
  for (const cat of DATA.categories) {
    if (!catActive(cat)) continue;
    const feats = visibleFeatures(cat);
    const inst = cat.multiInstance ? activeInstance(cat.id) : '1';
    if (!feats.length) continue;
    const done = feats.filter(f => (state.findings[qkey(f.id, inst)] || {}).severity).length;
    tabs.push([cat.id, cat.name, done + '/' + feats.length, done === feats.length && feats.length ? 'done' : '']);
  }
  const c = completeness();
  tabs.push(['dashboard', 'Dashboard', c.done ? String(c.done) : '', '']);
  tabs.push(['report', 'Report', '', '']);
  bar.innerHTML = tabs.map(([id, label, badge, cls]) =>
    `<button class="tab" id="tab-${id}" data-tab="${id}">${esc(label)}${badge ? `<span class="tab-badge ${cls || ''}">${badge}</span>` : ''}</button>`).join('');
  bar.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  // ensure a panel exists for every category
  const main = document.querySelector('main');
  for (const cat of DATA.categories) {
    if (!document.getElementById('panel-' + cat.id)) {
      const s = document.createElement('section');
      s.className = 'tab-panel'; s.id = 'panel-' + cat.id;
      main.insertBefore(s, document.getElementById('panel-dashboard'));
    }
  }
}

// ── assessments tab ───────────────────────────
function renderClientsTab() {
  const p = document.getElementById('panel-clients');
  const rows = clients.map(c => {
    const st = (() => { try { return JSON.parse(localStorage.getItem(CK(c.id))) || {}; } catch (e) { return {}; } })();
    const n = Object.values(st.findings || {}).filter(f => f && f.severity).length;
    return `<div class="clientrow${c.id === currentId ? ' active' : ''}">
      <div><div class="cn">${esc(c.name)}</div>
        <div class="cm">${n} scored · created ${new Date(c.created).toLocaleDateString()}${c.updated ? ' · updated ' + new Date(c.updated).toLocaleDateString() : ''}
        ${st.purgedAt ? ' · <span class="purged">photos purged ' + new Date(st.purgedAt).toLocaleDateString() + '</span>' : ''}</div></div>
      <div class="ca">
        ${c.id === currentId ? '<span class="pill corepill">Open</span>' : `<button class="btn btn-secondary btn-sm" data-open="${c.id}">Open</button>`}
        <button class="btn btn-secondary btn-sm" data-exp="${c.id}">Export</button>
        <button class="btn btn-danger btn-sm" data-purge="${c.id}">Purge photos</button>
      </div></div>`;
  }).join('') || `<div class="empty-state"><h3>No assessments yet</h3><p>Create one before the visit and pre-fill the intake from the consultation call.</p></div>`;

  p.innerHTML = `<div class="panel-header"><div class="eyebrow">Files</div><h2>Assessments</h2>
      <div class="subtitle">One file per client. Photographs live in this browser's database, not in the page.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
      <button class="btn btn-primary" id="btnNew">+ New assessment</button>
      <button class="btn btn-secondary" id="btnImport">Import a file</button>
      <button class="btn btn-secondary" id="btnRename">Rename this one</button>
    </div>
    ${rows}
    <div class="section-card" style="margin-top:22px"><h3>Storage</h3>
      <div id="storageInfo" class="subtitle">Checking…</div>
      <div class="storage-bar" id="storageBar"><div style="width:0%"></div></div>
      <div class="callout"><strong>Export after every visit.</strong> Browser storage is not a backup. Exporting writes one file containing the intake, every score, every measurement and every photograph, which is what belongs in the client folder before you drive away.</div>
    </div>
    <div class="section-card"><h3>Retention</h3>
      <p class="subtitle" style="margin-bottom:10px">The client agreement commits to deleting photographs and measurements 24 months after report delivery. Purge stamps the date so the commitment can be evidenced.</p>
      <div id="retentionInfo" class="subtitle"></div>
    </div>`;
  p.querySelector('#btnNew').addEventListener('click', () => {
    const n = prompt('Client name or address for this assessment'); if (n === null) return;
    newClient(n || 'Untitled assessment'); bootClient();
  });
  p.querySelector('#btnImport').addEventListener('click', importFile);
  p.querySelector('#btnRename').addEventListener('click', () => {
    const n = prompt('Rename this assessment', state.name); if (!n) return;
    state.name = n; saveState(); renderClientsTab(); renderClientPicker();
  });
  p.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { loadClient(b.dataset.open); bootClient(); }));
  p.querySelectorAll('[data-exp]').forEach(b => b.addEventListener('click', () => exportClient(b.dataset.exp)));
  p.querySelectorAll('[data-purge]').forEach(b => b.addEventListener('click', () => purgeClient(b.dataset.purge)));
  const ri = p.querySelector('#retentionInfo');
  ri.innerHTML = state.deleteAfter
    ? `This assessment is scheduled for photo deletion on <strong>${new Date(state.deleteAfter).toLocaleDateString()}</strong>.`
    : `<button class="btn btn-secondary btn-sm" id="btnSched">Set the 24-month deletion date</button>`;
  const bs = p.querySelector('#btnSched');
  if (bs) bs.addEventListener('click', () => {
    const d = new Date(); d.setMonth(d.getMonth() + 24);
    state.deleteAfter = d.getTime(); saveState(); renderClientsTab();
  });
  updateStorage();
}
async function updateStorage() {
  const info = document.getElementById('storageInfo'), bar = document.getElementById('storageBar');
  if (!info) return;
  let used = 0, quota = 0;
  try { const est = await navigator.storage.estimate(); used = est.usage || 0; quota = est.quota || 0; } catch (e) {}
  const mb = n => (n / 1048576).toFixed(1) + ' MB';
  const pct = quota ? Math.min(100, used / quota * 100) : 0;
  info.innerHTML = quota
    ? `${mb(used)} used of roughly ${mb(quota)} available in this browser.`
    : `This browser does not report a storage estimate. Export after every visit.`;
  if (bar) { bar.className = 'storage-bar' + (pct > 80 ? ' crit' : pct > 60 ? ' warn' : ''); bar.firstElementChild.style.width = pct + '%'; }
}

// ── export / import / purge ───────────────────
function blobToDataUrl(b) { return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); }
async function exportClient(id) {
  const raw = localStorage.getItem(CK(id)); if (!raw) return;
  const st = JSON.parse(raw);
  const recs = await idbByIndex('client', id);
  const photos = {};
  for (const r of recs) photos[r.key] = { featureKey: r.featureKey, ts: r.ts, data: await blobToDataUrl(r.blob) };
  const payload = { format: 'shs-assessment-v3', exported: new Date().toISOString(), state: st, photos };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload)], { type: 'application/json' }));
  a.download = 'SHS_' + (st.name || 'assessment').replace(/[^\w-]+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}
function importFile() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = () => {
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d.state) throw new Error('not an assessment export');
        const st = d.state;
        if (!clients.find(c => c.id === st.id)) clients.unshift({ id: st.id, name: st.name, created: st.created, updated: Date.now() });
        localStorage.setItem(CK(st.id), JSON.stringify(st)); saveIndex();
        for (const [k, v] of Object.entries(d.photos || {})) {
          const blob = await (await fetch(v.data)).blob();
          await idbPut({ key: k, clientId: st.id, featureKey: v.featureKey, blob, ts: v.ts });
        }
        loadClient(st.id); bootClient(); alert('Imported ' + (st.name || 'assessment') + '.');
      } catch (e) { alert('That file could not be imported: ' + e.message); }
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
}
async function purgeClient(id) {
  if (!confirm('Permanently delete every photograph for this assessment? The scores, measurements and notes are kept.')) return;
  const n = await idbDeleteClient(id);
  const raw = localStorage.getItem(CK(id)); if (!raw) return;
  const st = JSON.parse(raw);
  st.purgedAt = Date.now();
  for (const k of Object.keys(st.findings || {})) st.findings[k].photos = [];
  localStorage.setItem(CK(id), JSON.stringify(st));
  if (id === currentId) loadClient(id);
  alert(n + ' photograph' + (n === 1 ? '' : 's') + ' deleted. The date is stamped on the file.');
  renderClientsTab(); rebuildCategoryTabs(); updateStorage();
}

// ── dashboard ─────────────────────────────────
function renderDashboard() {
  const p = document.getElementById('panel-dashboard');
  const score = computeScore(), c = completeness();
  const all = scoredFindings();
  const n = s => all.filter(x => x.r.severity === s).length;
  let label = 'In progress', cls = 's1';
  if (score !== null) {
    if (score < 30) { label = 'Critical'; cls = 's5'; }
    else if (score < 50) { label = 'Significant concerns'; cls = 's4'; }
    else if (score < 70) { label = 'Moderate concerns'; cls = 's3'; }
    else if (score < 85) { label = 'Minor concerns'; cls = 's2'; }
    else { label = 'Good'; cls = 's1'; }
  }
  const nd = nextDollar().slice(0, 12);
  const noPhoto = all.filter(x => x.r.severity >= 3 && (x.r.photos || []).length < 2);
  const noMeasure = all.filter(x => x.r.severity >= 3 && !(x.r.measurement || '').trim());
  p.innerHTML = `
    <div class="score-hero">
      <div class="score-circle"><div class="score-num">${score === null ? '—' : score}</div><div class="score-label">${esc(label)}</div></div>
      <div><h2>${esc(state.name)}</h2>
        <p>${c.done} of ${c.total} checkpoints scored in ${state.mode === 'field' ? 'field' : 'full'} scope · ${c.pct}% complete</p>
        <div class="internal"><strong>Internal only.</strong> This score is a working instrument for tracking a home between assessments. It is not printed in the client report, and it moves when you skip checkpoints — read it alongside the completion percentage, never on its own.</div></div>
    </div>
    <div class="dashboard-grid">
      <div class="dash-card s5"><div class="label">Critical</div><div class="value">${n(5)}</div><div class="sub">Fix urgently</div></div>
      <div class="dash-card s4"><div class="label">Significant</div><div class="value">${n(4)}</div><div class="sub">Should be addressed</div></div>
      <div class="dash-card s3"><div class="label">Moderate</div><div class="value">${n(3)}</div><div class="sub">Recommended fix</div></div>
      <div class="dash-card s1"><div class="label">Compliant</div><div class="value">${n(1)}</div><div class="sub">No concern found</div></div>
    </div>
    ${(noPhoto.length || noMeasure.length) ? `<div class="callout warn"><strong>Before you leave the property.</strong>
      ${noPhoto.length ? noPhoto.length + ' finding' + (noPhoto.length > 1 ? 's' : '') + ' rated moderate or worse ' + (noPhoto.length > 1 ? 'have' : 'has') + ' fewer than two photographs. ' : ''}
      ${noMeasure.length ? noMeasure.length + ' ' + (noMeasure.length > 1 ? 'have' : 'has') + ' no measurement recorded. ' : ''}
      Both are Stage 4 Done-When items in the operations manual.</div>` : ''}
    <h3 style="font-size:1.4rem;margin:24px 0 10px">Where the next dollar goes</h3>
    <table class="findings-table"><thead><tr><th></th><th>Finding</th><th>Report category</th><th>Severity</th><th>Cost band</th></tr></thead><tbody>
      ${nd.map(x => `<tr><td class="sev-cell s${x.r.severity}"></td><td>${esc(x.f.title)}${x.f.instanceLabel ? ' <span style="color:#8A8078">(' + esc(x.f.instanceLabel) + ')</span>' : ''}</td><td>${esc(x.f.rc)}</td><td>${x.r.severity}</td><td>${esc(DATA.costBands[x.f.cost].range)}</td></tr>`).join('')
      || '<tr><td colspan="5" style="padding:18px;color:#8A8078">Nothing scored yet.</td></tr>'}
    </tbody></table>`;
}

// ── report ────────────────────────────────────
function renderReportTab() {
  const p = document.getElementById('panel-report');
  p.innerHTML = `<div class="panel-header"><div class="eyebrow">Draft</div><h2>Working report</h2>
      <div class="subtitle">A structured draft for assembling the client report in Stage 6. The client-facing PDF is produced from this content, not printed directly from this page.</div></div>
    <div class="report-controls">
      <button class="btn btn-primary" id="btnDraw">Generate draft</button>
      <button class="btn btn-secondary" onclick="window.print()">Print</button>
      <div class="report-options">
        <label><input type="checkbox" id="optPhotos" checked> Include photographs</label>
        <label><input type="checkbox" id="optScore"> Include the internal score</label>
      </div>
    </div>
    <div class="callout"><strong>Arithmetic gate.</strong> Cost bands below are planning ranges from the tool, not the itemized estimates that go to the client. Every figure in the client report is the sum of its own line items — never a number retyped from this page.</div>
    <div id="report-output-wrap"></div>`;
  p.querySelector('#btnDraw').addEventListener('click', drawReport);
  drawReport();
}
async function drawReport() {
  const wrap = document.getElementById('report-output-wrap'); if (!wrap) return;
  const withPhotos = document.getElementById('optPhotos').checked;
  const withScore = document.getElementById('optScore').checked;
  const i = state.intake, all = scoredFindings();
  const nd = nextDollar();
  const byPhase = { 1: [], 2: [], 3: [] };
  for (const x of nd) byPhase[phaseOf(x)].push(x);

  let h = '<div class="report-output">';
  h += `<h1>Home Safety Assessment — working draft</h1>`;
  h += `<div class="meta-block"><p><strong>Client:</strong> ${esc(i.client_name || '[not entered]')}</p>
    ${i.client_address ? `<p><strong>Address:</strong> ${esc(i.client_address)}</p>` : ''}
    <p><strong>Assessment date:</strong> ${esc(i.visit_date || '[not entered]')}</p>
    <p><strong>Assessor:</strong> ${esc(i.assessor_name || DATA.assessorDefaults.name)}, ${esc(i.assessor_credentials || DATA.assessorDefaults.credentials)}</p>
    <p><strong>Service:</strong> ${esc(DATA.assessorDefaults.company)}</p></div>`;

  const c = completeness();
  h += `<h2>Summary</h2><p>${all.length} findings recorded across ${new Set(all.map(x => x.f.rc)).size} report categories. ` +
       `${all.filter(x => x.r.severity === 5).length} critical, ${all.filter(x => x.r.severity === 4).length} significant, ` +
       `${all.filter(x => x.r.severity === 3).length} moderate, ${all.filter(x => x.r.severity === 2).length} minor. ` +
       `${c.done} of ${c.total} checkpoints scored.</p>`;
  if (withScore) h += `<p><strong>Internal safety score:</strong> ${computeScore() === null ? '—' : computeScore()} / 100 at ${c.pct}% completion. Not for client distribution.</p>`;
  if (i.primary_concern) h += `<p><strong>Primary concern:</strong> ${esc(i.primary_concern)}</p>`;

  h += '<h2>Findings by report category</h2>';
  for (const rc of REPORT_CATEGORIES) {
    const items = all.filter(x => x.f.rc === rc);
    if (!items.length) { h += `<h3>${esc(rc)}</h3><p style="color:#8A8078">Assessed. No action required.</p>`; continue; }
    h += `<h3>${esc(rc)} <span style="font-size:.8rem;color:#8A8078">${items.length} finding${items.length > 1 ? 's' : ''}</span></h3>`;
    h += '<table><thead><tr><th>Finding</th><th>Measured</th><th>Basis</th><th>Severity</th><th>Cost band</th></tr></thead><tbody>';
    for (const x of items) {
      h += `<tr><td><strong>${esc(x.f.title)}</strong>${x.f.instanceLabel ? ' (' + esc(x.f.instanceLabel) + ')' : ''}
        <div style="font-size:.78rem;color:#8A8078">${esc(x.f.required)}</div>
        ${x.r.notes ? `<div style="font-size:.78rem;color:#504840;margin-top:3px">${esc(x.r.notes)}</div>` : ''}</td>
        <td>${esc(x.r.measurement || '—')}</td>
        <td style="font-size:.76rem">${x.f.sourceType === 'best_practice' ? 'Best practice' : esc(x.f.clause)}</td>
        <td>${x.r.severity}</td><td>${esc(DATA.costBands[x.f.cost].range)}</td></tr>`;
    }
    h += '</tbody></table>';
  }

  h += `<h2>Where the next dollar goes</h2><p>Ranked by hazard weight × severity, divided by the square root of the estimated cost.</p>`;
  nd.slice(0, 15).forEach((x, k) => {
    h += `<div class="rank-row"><div class="rk">${k + 1}</div><div><strong>${esc(x.f.title)}</strong>
      <div style="font-size:.78rem;color:#8A8078">${esc(x.f.rc)}${x.f.instanceLabel ? ' · ' + esc(x.f.instanceLabel) : ''}</div></div>
      <div style="font-size:.78rem">Severity ${x.r.severity}</div>
      <div style="font-size:.78rem;text-align:right">${esc(DATA.costBands[x.f.cost].range)}</div></div>`;
  });

  h += '<h2>Phased plan</h2>';
  const pname = { 1: 'Phase 1 · this month', 2: 'Phase 2 · within 3 months', 3: 'Phase 3 · within 6 to 12 months' };
  for (const ph of [1, 2, 3]) {
    h += `<h3>${pname[ph]}</h3>`;
    h += byPhase[ph].length
      ? '<ul>' + byPhase[ph].map(x => `<li>${esc(x.f.title)}${x.f.instanceLabel ? ' (' + esc(x.f.instanceLabel) + ')' : ''} — ${esc(DATA.costBands[x.f.cost].range)}</li>`).join('') + '</ul>'
      : '<p style="color:#8A8078">Nothing assigned.</p>';
  }
  h += `<p style="font-size:.82rem;color:#8A8078">Every finding above sits in exactly one phase. Carry that rule into the client report so the phase totals reconcile to the report total.</p>`;

  const funds = matchedFunding();
  h += '<h2>Funding programs matched to this client</h2>';
  h += funds.length
    ? '<table><thead><tr><th>Program</th><th>Maximum</th><th>Why it is matched</th><th>Verify</th></tr></thead><tbody>' +
      funds.map(({ p, why }) => `<tr><td><strong>${p.acronym}</strong><br><span style="font-size:.76rem;color:#8A8078">${esc(p.name)}</span></td>
        <td style="font-size:.8rem">${esc(p.max)}</td><td style="font-size:.8rem">${esc(why)}<div style="color:#8A8078;margin-top:3px">${esc(p.notes)}</div></td>
        <td style="font-size:.76rem">${esc(p.verify_url)}</td></tr>`).join('') + '</tbody></table>'
    : '<p style="color:#8A8078">No program matched from the findings scored so far. Programs are matched to this client’s findings, never listed by default.</p>';

  if (withPhotos) {
    const withP = all.filter(x => (x.r.photos || []).length);
    if (withP.length) {
      h += '<h2>Photo evidence</h2><div class="photo-grid" id="photoGrid"></div>';
    }
  }

  h += `<div class="disclaimer"><p><strong>Scope.</strong> ${esc(DATA.disclaimers.scope)}</p>
    <p style="margin-top:8px"><strong>Certification.</strong> ${esc(DATA.disclaimers.no_certification)}</p>
    <p style="margin-top:8px"><strong>Standards.</strong> ${esc(DATA.disclaimers.csa_alignment)}</p>
    <p style="margin-top:8px"><strong>Funding.</strong> ${esc(DATA.disclaimers.funding)}</p></div></div>`;
  wrap.innerHTML = h;

  if (withPhotos) {
    const grid = document.getElementById('photoGrid');
    if (grid) {
      const recs = await idbByIndex('client', state.id);
      for (const x of all) for (const pk of (x.r.photos || [])) {
        const rec = recs.find(r => r.key === pk); if (!rec) continue;
        const url = URL.createObjectURL(rec.blob); objectUrls.push(url);
        const d = document.createElement('div'); d.className = 'photo-cell';
        d.innerHTML = `<img src="${url}" alt=""><div class="cap"><strong>${esc(x.f.baseId)}</strong> ${esc(x.f.title)}</div>`;
        grid.appendChild(d);
      }
    }
  }
}

// ── mode + picker ─────────────────────────────
function renderModeBar() {
  const el = document.getElementById('modebar');
  const c = completeness();
  el.innerHTML = `<span class="lbl">Scope</span>
    <span class="seg"><button data-mode="field" class="${state.mode === 'field' ? 'on' : ''}">Field</button>
    <button data-mode="all" class="${state.mode === 'all' ? 'on' : ''}">Full</button></span>
    <span class="modehint">${state.mode === 'field'
      ? 'Core set plus the modules your intake answers triggered — ' + c.total + ' checkpoints. Photograph the rest and score them at the desk.'
      : 'Every checkpoint in scope — ' + c.total + '. Use this at the desk, not in the home.'}</span>`;
  el.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    state.mode = b.dataset.mode; saveState(); renderModeBar(); renderTabBar(); rebuildCategoryTabs();
  }));
}
function renderClientPicker() {
  const sel = document.getElementById('clientPick');
  sel.innerHTML = clients.map(c => `<option value="${c.id}"${c.id === currentId ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
}

// ── boot ──────────────────────────────────────
function bootClient() {
  objectUrls.forEach(URL.revokeObjectURL); objectUrls = [];
  renderClientPicker(); renderModeBar(); renderTabBar();
  buildIntakeTab(); rebuildCategoryTabs();
  switchTab('intake');
}
function init() {
  loadIndex();
  let last = null; try { last = localStorage.getItem('shs_v3_last'); } catch (e) {}
  if (!clients.length) newClient('Untitled assessment');
  else loadClient(clients.find(c => c.id === last) ? last : clients[0].id);
  document.getElementById('clientPick').addEventListener('change', e => { loadClient(e.target.value); bootClient(); });
  document.getElementById('btnExportTop').addEventListener('click', () => exportClient(currentId));
  bootClient();
  switchTab('clients');
  window.addEventListener('beforeunload', () => { objectUrls.forEach(URL.revokeObjectURL); });
}
document.addEventListener('DOMContentLoaded', init);

</script>
<script>
/* Offline support. The page is cached on first load, so the tool opens
   with no signal. Updates are picked up in the background and take
   effect the next time it is launched. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Offline cache unavailable:', e && e.message);
    });
  });
}
</script>
</body>
